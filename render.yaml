databases:
  - name: finance-tracker-db
    plan: free
    region: oregon
    postgresMajorVersion: "18"

services:
  - name: finance-tracker-api
    type: web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/transactions
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finance-tracker-db
          property: connectionString
      # Update this if the frontend's actual onrender.com URL differs from
      # the name below (Render appends a random suffix on name collisions).
      - key: ALLOWED_ORIGINS
        value: https://finance-tracker.onrender.com

  - name: finance-tracker
    type: web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      # Update this if the backend's actual onrender.com URL differs from
      # the name above.
      - key: VITE_API_BASE_URL
        value: https://finance-tracker-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
